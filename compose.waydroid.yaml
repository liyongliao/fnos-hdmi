# Set these to read-only loop devices allocated ONLY to the Android images.
# Use setup-waydroid.py; its host service prepares devices after each reboot.
services:
  ubuntu26-gnome-hdmi:
    # Do not auto-start with stale loop device numbers after a host reboot.
    # The host service prepares the mappings, then starts this container.
    restart: "no"
    # GNOME plus GAPPS exceeds the base desktop's 2048-thread budget.
    pids_limit: ${WAYDROID_PIDS_LIMIT:-8192}
    mem_limit: ${WAYDROID_MEMORY_LIMIT:-6g}
    memswap_limit: ${WAYDROID_MEMORY_LIMIT:-6g}
    volumes:
      - ./prepare-waydroid-android.py:/usr/local/sbin/prepare-waydroid-android.py:ro
    cap_add:
      - IPC_LOCK
      - SYS_RESOURCE
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - BLOCK_SUSPEND
    ulimits:
      memlock:
        soft: 1073741824
        hard: 1073741824
    devices:
      - ${WAYDROID_SYSTEM_LOOP:?prepare Android system loop}:/dev/waydroid-system:r
      - ${WAYDROID_VENDOR_LOOP:?prepare Android vendor loop}:/dev/waydroid-vendor:r
