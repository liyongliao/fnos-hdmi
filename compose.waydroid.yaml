# Deprecated compatibility overlay.
#
# Waydroid now runs in the same Docker configuration from the first Ubuntu
# boot onward. Android images are downloaded and mounted inside Ubuntu; no
# WAYDROID_SYSTEM_LOOP/WAYDROID_VENDOR_LOOP variables or host-side container
# recreation are required. Keeping this empty overlay avoids breaking old
# commands that still mention `-f compose.waydroid.yaml`.
services: {}
