services:
  ubuntu26-gnome-hdmi:
    image: ${DESKTOP_IMAGE:-fnos-ubuntu26-gnome-hdmi:wayland-zh}
    pull_policy: never
    container_name: ubuntu26-gnome-hdmi
    hostname: ubuntu26-hdmi
    cap_add:
      # GNOME/systemd plus nested Waydroid/LXC runtime capabilities. This is
      # still deliberately narrower than privileged:true and does not expose
      # unrelated fnOS block/GPU devices.
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_TTY_CONFIG
      - SYS_NICE
      - IPC_LOCK
      - SYS_RESOURCE
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - BLOCK_SUSPEND
      - MKNOD
    security_opt:
      # fnOS AppArmor otherwise blocks remounting the container's private
      # cgroup namespace read-write before systemd starts.
      - apparmor=unconfined
      # GNOME 50 delegates image decoding to glycin. Its bubblewrap sandbox
      # and nested LXC need syscalls blocked by Docker's default profile.
      - seccomp=unconfined
    # Keep systemd's cgroups inside the container namespace. Never give the
    # container a writable view of the host's complete cgroup tree.
    cgroup: private
    sysctls:
      # Waydroid's bridge runs only in this private Docker network namespace.
      net.ipv4.ip_forward: "1"
    tty: true
    stdin_open: true
    stop_signal: SIGRTMIN+3
    stop_grace_period: 45s
    restart: unless-stopped

    # Desktop-computer mode: do not hard-cap RAM, swap or PID count here.
    # GNOME + browser + RDP + Waydroid/GAPPS can burst significantly. Optional
    # host safety ceilings belong in compose.resource-limits.yaml.

    environment:
      container: docker
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh
      LC_ALL: zh_CN.UTF-8
      DESKTOP_USER: ${DESKTOP_USER:-ubuntu}
      DESKTOP_UID: ${DESKTOP_UID:-1000}
      DESKTOP_GID: ${DESKTOP_GID:-1000}
      DESKTOP_PASSWORD: ${DESKTOP_PASSWORD:?set DESKTOP_PASSWORD in .env}
      REMOTE_LOGIN_USER: ${REMOTE_LOGIN_USER:-${DESKTOP_USER:-ubuntu}}
      REMOTE_LOGIN_PASSWORD: ${REMOTE_LOGIN_PASSWORD:-${DESKTOP_PASSWORD}}
      AUTO_LOGIN: ${AUTO_LOGIN:-false}
      REMOTE_MODE: ${REMOTE_MODE:-both}
      SCREEN_SHARE_MODE: ${SCREEN_SHARE_MODE:-mirror-primary}
      DESKTOP_SHARING_PORT: 3390
      DISABLE_UDISKS: ${DISABLE_UDISKS:-true}
      NAS_STORAGE_ROOT: /mnt/fnos
    ports:
      - "${RDP_PORT:-3389}:3390"
      - "${DESKTOP_SHARING_PORT:-3390}:3390"
      - "${REMOTE_LOGIN_PORT:-3391}:3389"
    volumes:
      - ${DESKTOP_HOME:-/vol1/1000/docker/ubuntu}:/home/${DESKTOP_USER:-ubuntu}
      # Waydroid downloads and manages its own Android images here. The desktop
      # container never has to be recreated when these files appear/update.
      - ${WAYDROID_DATA:-./waydroid-data}:/var/lib/waydroid
      - ./container-entrypoint.sh:/usr/local/sbin/container-entrypoint:ro
      - ./configure-waydroid.py:/usr/local/sbin/configure-waydroid.py:ro
      - ./prepare-waydroid-android.py:/usr/local/sbin/prepare-waydroid-android.py:ro
      - ./prepare-waydroid-runtime.sh:/usr/local/sbin/prepare-waydroid-runtime:ro
      - ./enable-desktop-sharing.sh:/usr/local/sbin/enable-desktop-sharing:ro
      - ./enable-remote-login.sh:/usr/local/sbin/enable-remote-login:ro
      - ./fnos-desktop-sharing.service:/etc/systemd/system/fnos-desktop-sharing.service:ro
      - ./fnos-remote-login.service:/etc/systemd/system/fnos-remote-login.service:ro
      - ./99-fnos-login-screen.gschema.override:/usr/share/glib-2.0/schemas/99-fnos-login-screen.gschema.override:ro
      - /dev/input:/dev/input
      - /dev/snd:/dev/snd
      - /run/udev:/run/udev:ro
    devices:
      # Expose only the physical display PF. card1-card4 are SR-IOV VFs and
      # must not be enumerated by Mutter/GDM.
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
    device_cgroup_rules:
      - "c 13:* rmw"
      - "c 116:* rmw"
      # binderfs creates binder, hwbinder and vndbinder dynamically. fnOS 6.18
      # currently assigns major 243; quick-start.sh detects the actual number.
      - "c ${BINDER_DEVICE_MAJOR:-243}:* rmw"
      # Single-runtime Waydroid support. util-linux mount allocates loop devices
      # for system.img/vendor.img inside this container. Major 7 is loop only;
      # physical fnOS disks (dm/nvme/sd) remain blocked. loop-control is the
      # standard misc char device 10:237 and is created in the private /dev.
      - "c 10:237 rmw"
      - "b 7:* rmw"
    ulimits:
      memlock:
        soft: 1073741824
        hard: 1073741824
      nofile:
        soft: 1048576
        hard: 1048576
    tmpfs:
      - /run:rw,nosuid,nodev,mode=755,size=512m
      - /run/lock:rw,nosuid,nodev,noexec,mode=755,size=32m
      - /tmp:rw,nosuid,nodev,mode=1777,size=2g
    shm_size: 2gb

  guacd:
    image: guacamole/guacd:1.6.0
    pull_policy: never
    container_name: ubuntu26-guacd
    profiles: ["web"]
    restart: unless-stopped
    mem_limit: ${GUACD_MEMORY_LIMIT:-512m}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  guacamole:
    image: guacamole/guacamole:1.6.0
    pull_policy: never
    container_name: ubuntu26-guacamole
    profiles: ["web"]
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    pids_limit: 1024
    depends_on:
      - guacd
      - ubuntu26-gnome-hdmi
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      GUACAMOLE_HOME: /etc/guacamole/custom
      WEBAPP_CONTEXT: ROOT
      JAVA_OPTS: -Xms64m -Xmx512m
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./guacamole:/etc/guacamole/custom:ro

networks:
  default:
    driver: bridge
