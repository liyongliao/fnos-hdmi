services:
  ubuntu26-gnome-hdmi:
    image: ${DESKTOP_IMAGE:-fnos-ubuntu26-gnome-hdmi:wayland-zh}
    pull_policy: never
    container_name: ubuntu26-gnome-hdmi
    hostname: ubuntu26-hdmi

    # Compatibility first: users can choose Docker privileged mode from .env.
    # true  = maximum hardware/LXC/Waydroid compatibility.
    # false = scoped capabilities + device rules below.
    privileged: ${PRIVILEGED_MODE:-true}

    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_TTY_CONFIG
      - SYS_NICE
      - IPC_LOCK
      - SYS_RESOURCE
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - BLOCK_SUSPEND
      - MKNOD
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    cgroup: private
    sysctls:
      # Waydroid creates waydroid0 inside this container. Docker bridge then
      # provides the second NAT layer to fnOS/LAN/Internet.
      net.ipv4.ip_forward: "1"
    tty: true
    stdin_open: true
    stop_signal: SIGRTMIN+3
    stop_grace_period: 45s
    restart: unless-stopped

    environment:
      container: docker
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh
      LC_ALL: zh_CN.UTF-8
      DESKTOP_USER: ${DESKTOP_USER:-ubuntu}
      DESKTOP_UID: ${DESKTOP_UID:-1000}
      DESKTOP_GID: ${DESKTOP_GID:-1000}
      DESKTOP_PASSWORD: ${DESKTOP_PASSWORD:?set DESKTOP_PASSWORD in .env}
      REMOTE_LOGIN_USER: ${REMOTE_LOGIN_USER:-${DESKTOP_USER:-ubuntu}}
      REMOTE_LOGIN_PASSWORD: ${REMOTE_LOGIN_PASSWORD:-${DESKTOP_PASSWORD}}
      AUTO_LOGIN: ${AUTO_LOGIN:-false}
      REMOTE_MODE: ${REMOTE_MODE:-both}
      SCREEN_SHARE_MODE: ${SCREEN_SHARE_MODE:-mirror-primary}
      DESKTOP_SHARING_PORT: 3390
      DISABLE_UDISKS: ${DISABLE_UDISKS:-true}
      NAS_STORAGE_ROOT: /mnt/fnos
      # Optional NAS folder exposed inside Android app storage. Empty disables
      # the bridge; read-only is the safe default for a photo library.
      WAYDROID_MEDIA_SOURCE: ${WAYDROID_MEDIA_SOURCE:-}
      WAYDROID_MEDIA_TARGET: ${WAYDROID_MEDIA_TARGET:-Pictures/nas}
      WAYDROID_MEDIA_MODE: ${WAYDROID_MEDIA_MODE:-ro}
      WAYDROID_MEDIA_SCAN_INTERVAL: ${WAYDROID_MEDIA_SCAN_INTERVAL:-1800}
      # In privileged mode Docker exposes every DRM node. Keep only the known
      # physical display PF in the container /dev so Mutter does not enumerate
      # fnOS SR-IOV VFs. Set false if another GPU is intentionally required.
      LIMIT_GPU_DEVICES: ${LIMIT_GPU_DEVICES:-true}

    ports:
      # BIND_ADDRESS=0.0.0.0 exposes services on all fnOS interfaces. Change it
      # to a LAN/VPN IP when you want to bind more narrowly.
      - "${BIND_ADDRESS:-0.0.0.0}:${RDP_PORT:-3389}:3390"
      - "${BIND_ADDRESS:-0.0.0.0}:${DESKTOP_SHARING_PORT:-3390}:3390"
      - "${BIND_ADDRESS:-0.0.0.0}:${REMOTE_LOGIN_PORT:-3391}:3389"

    volumes:
      - ${DESKTOP_HOME:-/vol1/1000/docker/ubuntu}:/home/${DESKTOP_USER:-ubuntu}
      - ${WAYDROID_DATA:-./waydroid-data}:/var/lib/waydroid
      - ./container-entrypoint.sh:/usr/local/sbin/container-entrypoint:ro
      - ./configure-waydroid.py:/usr/local/sbin/configure-waydroid.py:ro
      - ./prepare-waydroid-android.py:/usr/local/sbin/prepare-waydroid-android.py:ro
      - ./prepare-waydroid-runtime.sh:/usr/local/sbin/prepare-waydroid-runtime:ro
      - ./waydroid-media-bridge.sh:/usr/local/sbin/waydroid-media-bridge:ro
      - ./fnos-waydroid-media.service:/etc/systemd/system/fnos-waydroid-media.service:ro
      - ./enable-desktop-sharing.sh:/usr/local/sbin/enable-desktop-sharing:ro
      - ./enable-remote-login.sh:/usr/local/sbin/enable-remote-login:ro
      - ./configure-tv-desktop.sh:/usr/local/sbin/configure-tv-desktop:ro
      - ./fnos-desktop-sharing.service:/etc/systemd/system/fnos-desktop-sharing.service:ro
      - ./fnos-remote-login.service:/etc/systemd/system/fnos-remote-login.service:ro
      - ./99-fnos-login-screen.gschema.override:/usr/share/glib-2.0/schemas/99-fnos-login-screen.gschema.override:ro
      - /dev/input:/dev/input
      - /dev/snd:/dev/snd
      - /run/udev:/run/udev:ro

    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse

    # These rules matter when PRIVILEGED_MODE=false. In privileged mode Docker
    # already grants device access, so keeping them is harmless.
    device_cgroup_rules:
      - "c 13:* rmw"
      - "c 116:* rmw"
      - "c ${BINDER_DEVICE_MAJOR:-243}:* rmw"
      - "c 10:237 rmw"
      - "b 7:* rmw"

    ulimits:
      memlock:
        soft: 1073741824
        hard: 1073741824
      nofile:
        soft: 1048576
        hard: 1048576

    tmpfs:
      - /run:rw,nosuid,nodev,mode=755,size=512m
      - /run/lock:rw,nosuid,nodev,noexec,mode=755,size=32m
      - /tmp:rw,nosuid,nodev,mode=1777,size=2g
    shm_size: 2gb

  guacd:
    image: guacamole/guacd:1.6.0
    pull_policy: never
    container_name: ubuntu26-guacd
    profiles: ["web"]
    restart: unless-stopped
    mem_limit: ${GUACD_MEMORY_LIMIT:-512m}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  guacamole:
    image: guacamole/guacamole:1.6.0
    pull_policy: never
    container_name: ubuntu26-guacamole
    profiles: ["web"]
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    pids_limit: 1024
    depends_on:
      - guacd
      - ubuntu26-gnome-hdmi
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      GUACAMOLE_HOME: /etc/guacamole/custom
      WEBAPP_CONTEXT: ROOT
      JAVA_OPTS: -Xms64m -Xmx512m
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./guacamole:/etc/guacamole/custom:ro

networks:
  default:
    driver: bridge
